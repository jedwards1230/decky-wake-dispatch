name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Frontend unit tests: Node's built-in runner, types stripped natively.
      - run: pnpm test
      - run: pnpm build

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Dry run of the release packaging: proves the plugin zip layout on every PR.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: scripts/package.sh
      - name: Verify zip layout
        run: |
          set -euo pipefail
          zip=out/wake-dispatch.zip
          tops=$(unzip -Z1 "$zip" | cut -d/ -f1 | sort -u)
          if [ "$tops" != "wake-dispatch" ]; then
            echo "::error::expected a single top-level folder wake-dispatch/, got: ${tops//$'\n'/ }"
            exit 1
          fi
          for f in plugin.json package.json main.py LICENSE README.md dist/index.js py_modules/; do
            unzip -Z1 "$zip" | grep -qxF "wake-dispatch/$f" \
              || { echo "::error::wake-dispatch/$f missing from $zip"; exit 1; }
          done
          if unzip -Z1 "$zip" | grep -E '__pycache__|\.py[co]$|\.map$'; then
            echo "::error::caches or source maps in $zip"
            exit 1
          fi
          echo "zip layout OK"
          {
            echo "## Plugin zip"
            echo ""
            echo '```'
            unzip -l "$zip"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wake-dispatch-zip
          path: out/wake-dispatch.zip
          if-no-files-found: error
