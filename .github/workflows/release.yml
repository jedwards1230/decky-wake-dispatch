# Release pipeline: builds out/wake-dispatch.zip from a git tag and publishes it
# as the asset of a normal (non-draft, non-prerelease) GitHub Release marked
# "latest".
#
# Two ways in:
#
#   1. Labelled merge (push to main). Releases are OPT-IN: the merged PR must
#      carry a semver:patch|minor|major label; no label -> nothing happens.
#      Version compute, tag creation and AI release notes are delegated to the
#      shared ai-release.yml reusable (create_release: false). Without an
#      ANTHROPIC_API_KEY secret the reusable falls back to GitHub-generated
#      notes, so this path still works, just with plainer notes.
#
#   2. Manual (workflow_dispatch) with an explicit X.Y.Z version. Needs no AI
#      key: tags the dispatched commit as vX.Y.Z if that tag does not exist yet
#      (an existing tag is reused as-is, so a failed run can be retried), then
#      publishes with GitHub-generated notes. Use this for the first release.
#
# Version source of truth: the git tag. package.json in the repo is never
# bumped or committed by CI; package.sh stamps the tag's version into the
# packaged copy of package.json only, so the zip always reports the version it
# was released as.
#
# Concurrency: only the tagging jobs (prepare / tag) share the `release` group,
# so tags are cut one at a time and an unlabelled push never occupies the slot
# (a queued labelled release can't be displaced by a no-op run).
#
# Recovering a failed run: use "Re-run failed jobs", never "Re-run all jobs" -
# re-running prepare after it pushed a tag would bump to the NEXT version. Or
# dispatch this workflow with the version of the existing tag: the tag is
# reused, and an existing release just gets its zip re-uploaded.
name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release: v{0} (manual)', inputs.version)
      || format('Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (tagged as vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # gh pr list (find the merged PR's labels)
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      bump_type: ${{ steps.detect.outputs.bump_type }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Determine release mode
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SAFE_INPUT="${INPUT_VERSION//[$'\r\n']/}"
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Wrong branch::Manual releases must be dispatched from main (got ${GITHUB_REF})"
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
            if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=Invalid version::'${SAFE_INPUT}' is not X.Y.Z (e.g. 0.1.0)"
              exit 1
            fi
            { echo "mode=manual"; echo "bump_type=none"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push: opt-in via the merged PR's semver:* label. Retry, because the
          # API may not have indexed the merge commit yet.
          LABELS=""
          for attempt in 1 2 3; do
            LABELS=$(gh pr list --state merged --base main --limit 100 \
              --json labels,mergeCommit \
              | jq -r --arg sha "$GITHUB_SHA" \
                '.[] | select(.mergeCommit.oid == $sha) | .labels[].name' 2>/dev/null || echo "")
            [ -n "$LABELS" ] && break
            echo "Attempt ${attempt}: no labels for ${GITHUB_SHA} yet, retrying in 5s..."
            sleep 5
          done
          echo "Labels: ${LABELS:-<none>}"
          if grep -qx 'semver:major' <<<"$LABELS"; then
            TYPE="major"
          elif grep -qx 'semver:minor' <<<"$LABELS"; then
            TYPE="minor"
          elif grep -qx 'semver:patch' <<<"$LABELS"; then
            TYPE="patch"
          else
            echo "::notice::No semver:* label on the merged PR, skipping release."
            { echo "mode=none"; echo "bump_type=none"; echo "version="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "mode=ai"; echo "bump_type=$TYPE"; echo "version="; } >> "$GITHUB_OUTPUT"

  # Path 1: compute version, push the tag, generate notes. Does not create the
  # Release; the publish job does that once the zip is built.
  prepare:
    name: Tag & generate notes
    needs: [detect]
    if: needs.detect.outputs.mode == 'ai'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the tag
      pull-requests: read # read merged PRs for the changelog
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@v1
    with:
      service_name: wake-dispatch
      service_description: "a Decky Loader plugin that sends Wake-on-LAN magic packets from the Steam Deck Quick Access menu"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      create_release: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Path 2: ensure vX.Y.Z exists, pointing at the dispatched commit if new.
  tag:
    name: Tag dispatched commit
    needs: [detect]
    if: needs.detect.outputs.mode == 'manual'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag ref
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create tag if absent
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} already exists, releasing it as-is."
          else
            gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "Created ${TAG} at ${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build plugin zip
    needs: [detect, prepare, tag]
    # Exactly one of prepare/tag runs; the other is skipped.
    if: >-
      !cancelled()
      && ((needs.detect.outputs.mode == 'ai' && needs.prepare.result == 'success')
        || (needs.detect.outputs.mode == 'manual' && needs.tag.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve tag
        id: ref
        env:
          TAG: ${{ needs.prepare.outputs.tag || needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::No release tag resolved"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Package
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: scripts/package.sh --version "${TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wake-dispatch-zip
          path: out/wake-dispatch.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [detect, prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload the asset
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wake-dispatch-zip
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          MODE: ${{ needs.detect.outputs.mode }}
          BODY_B64: ${{ needs.prepare.outputs.release_body }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Retry of a run whose release already exists: refresh the asset.
            gh release upload "$TAG" out/wake-dispatch.zip --clobber
            echo "## Re-uploaded wake-dispatch.zip to existing release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MODE" = "ai" ] && [ -n "$BODY_B64" ]; then
            # ai-release.yml emits the body base64-encoded (job outputs can't
            # carry newlines); decode before use.
            echo "$BODY_B64" | base64 -d > release-notes.md
            NOTES=(--notes-file release-notes.md)
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" out/wake-dispatch.zip \
            --verify-tag \
            --title "$TAG" \
            --latest \
            "${NOTES[@]}"
          {
            echo "## Released ${TAG}"
            echo ""
            echo "- Mode: ${MODE}"
            echo "- Asset: wake-dispatch.zip"
          } >> "$GITHUB_STEP_SUMMARY"
