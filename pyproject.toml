# Tooling configuration only; this project is not packaged for PyPI.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["node_modules", "dist", "decky.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["main", "wake_dispatch"]
known-third-party = ["decky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "py_modules"]
asyncio_mode = "auto"
